<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>帳務總覽</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
</head>
<body class="bg-gray-50 lg:bg-slate-50 font-sans antialiased">
<div id="main-container" class="max-w-md lg:max-w-6xl mx-auto bg-white lg:bg-transparent min-h-screen shadow-xl lg:shadow-none relative pb-28 lg:pb-12">

  <!-- Header -->
  <header class="sticky top-0 z-50 flex items-center gap-3 px-5 lg:px-8 py-3.5 lg:py-5 bg-white lg:bg-white/90 lg:backdrop-blur border-b border-gray-100">
    <a href="index.html" class="text-blue-600 text-xl leading-none lg:w-10 lg:h-10 lg:flex lg:items-center lg:justify-center lg:rounded-full lg:bg-slate-100 lg:hover:bg-blue-50 lg:hover:text-blue-600 lg:transition lg:text-base">←</a>
    <h1 id="group-name" class="flex-1 text-base font-bold text-gray-900 truncate lg:text-xl lg:font-black lg:tracking-tight">載入中...</h1>
    <button type="button" id="btn-copy" class="text-xs text-blue-600 border border-blue-200 px-3 py-1.5 rounded-full hover:bg-blue-50 transition lg:px-5 lg:py-2 lg:font-bold">分享</button>
  </header>

  <!-- 成員橫排 -->
  <div id="members-bar" class="px-5 lg:px-8 py-2.5 flex items-center gap-2 flex-wrap border-b border-gray-100 bg-white">
    <span class="text-xs text-gray-400 flex-shrink-0">成員</span>
    <div id="members-chips" class="flex flex-wrap gap-1.5 flex-1 min-w-0"></div>
    <div id="member-input-area" class="flex items-center gap-1.5 flex-shrink-0">
      <input type="text" id="input-member-name" placeholder="新增成員" maxlength="20"
        class="w-24 text-xs px-3 py-1.5 bg-gray-50 border border-gray-200 rounded-full focus:outline-none focus:border-blue-400 transition">
      <button type="button" id="btn-add-member"
        class="w-7 h-7 bg-blue-600 text-white rounded-full text-xl font-light flex items-center justify-center hover:bg-blue-700 transition leading-none pb-0.5">+</button>
    </div>
  </div>

  <!-- 鎖定 Banner -->
  <div id="locked-banner" class="hidden px-5 lg:px-8 py-2.5 bg-amber-50 border-b border-amber-200 flex items-center justify-between">
    <span class="text-xs font-medium text-amber-700">🔒 群組已結束，消費記錄鎖定中</span>
    <button id="btn-unlock" class="text-xs text-amber-600 underline hover:text-amber-800 transition">解除鎖定</button>
  </div>

  <!-- Tab 導航（手機顯示，桌機隱藏） -->
  <nav class="lg:hidden sticky top-[57px] z-40 flex bg-white border-b border-gray-100 px-5">
    <button type="button" class="tab-btn active-tab py-3 px-5 text-sm font-semibold text-blue-600 border-b-2 border-blue-600 -mb-px" data-tab="expense">消費</button>
    <button type="button" class="tab-btn py-3 px-5 text-sm font-semibold text-gray-400 border-b-2 border-transparent -mb-px" data-tab="settle">結算</button>
  </nav>

  <!-- 內容區：桌機雙欄 -->
  <div class="lg:grid lg:grid-cols-12 lg:gap-8 lg:px-8 lg:pt-8 lg:items-start">

    <!-- ── 左欄 / Tab：消費 ── -->
    <div id="pane-expense" class="tab-pane lg:col-span-7 lg:!block">

      <!-- 結算狀態卡 -->
      <div class="p-5 lg:p-0 lg:mb-6">
        <div class="bg-emerald-50 border border-emerald-100 p-5 lg:p-8 rounded-3xl lg:rounded-[2.5rem] shadow-sm relative overflow-hidden">
          <div class="absolute -top-10 -right-10 w-36 h-36 bg-emerald-200/20 rounded-full blur-3xl"></div>
          <div class="relative z-10">
            <div class="flex justify-between items-start mb-3 lg:mb-4">
              <div>
                <div class="text-xs font-semibold lg:font-black text-emerald-700 uppercase tracking-wider mb-1">群組總消費</div>
                <div class="text-3xl lg:text-5xl font-bold lg:font-black text-emerald-900 lg:tracking-tighter tabular-nums" id="total-amount">$0</div>
              </div>
              <span class="text-xs text-emerald-600 bg-emerald-100 px-2.5 py-1 rounded-full font-medium" id="expense-count">0 筆</span>
            </div>

            <!-- 我的概覽 -->
            <div id="status-my" class="hidden gap-5 lg:gap-8 pb-3 mb-3 border-b border-emerald-100">
              <div>
                <div class="text-xs text-emerald-600 mb-0.5 lg:font-bold lg:uppercase lg:tracking-tight">我已付</div>
                <div class="text-base lg:text-2xl font-bold lg:font-black text-emerald-800 tabular-nums" id="my-paid">—</div>
              </div>
              <div>
                <div class="text-xs text-emerald-600 mb-0.5 lg:font-bold lg:uppercase lg:tracking-tight">我應付</div>
                <div class="text-base lg:text-2xl font-bold lg:font-black text-emerald-800 tabular-nums" id="my-owed">—</div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- 列表標頭 -->
      <div class="px-5 lg:px-0 flex justify-between items-center mb-1">
        <h3 class="text-base font-semibold lg:font-black lg:text-slate-400 lg:uppercase lg:tracking-widest lg:text-xs text-gray-950">消費紀錄</h3>
        <div class="flex gap-3 lg:gap-4">
          <button type="button" id="btn-export-pdf" class="text-xs text-gray-400 hover:text-blue-600 transition lg:font-bold lg:uppercase">PDF</button>
          <button type="button" id="btn-export-excel" class="text-xs text-gray-400 hover:text-blue-600 transition lg:font-bold lg:uppercase">Excel</button>
        </div>
      </div>

      <!-- 消費卡片列表 -->
      <div id="expense-cards" class="px-5 lg:px-0 pb-4 space-y-3"></div>
    </div>

    <!-- ── 右欄 / Tab：結算 ── -->
    <div id="pane-settle" class="tab-pane hidden lg:col-span-5 lg:!block lg:sticky lg:top-24">
      <div class="p-5 lg:p-0 space-y-4">

        <div class="bg-white border border-gray-100 lg:border-slate-100 rounded-3xl lg:rounded-[2.5rem] p-5 lg:p-8 shadow-sm lg:shadow-xl lg:shadow-slate-200/30">
          <h2 class="text-xs font-semibold lg:font-black text-gray-400 uppercase tracking-wider lg:tracking-widest mb-3 lg:mb-6">結算明細</h2>
          <div id="settle-result" class="space-y-2"></div>
          <button type="button" id="btn-save-settlement"
            class="hidden w-full mt-4 py-3 lg:py-5 bg-gray-800 lg:bg-slate-900 text-white text-sm font-semibold lg:font-black rounded-2xl lg:rounded-[1.5rem] hover:bg-gray-900 lg:hover:bg-slate-800 transition lg:tracking-widest lg:shadow-xl lg:shadow-slate-200">
            專案結束結算
          </button>
          <div id="settlement-history"></div>
        </div>

        <div class="bg-white border border-gray-100 lg:border-slate-200/50 rounded-3xl lg:rounded-[2.5rem] p-5 lg:p-8 shadow-sm lg:bg-slate-100/50">
          <h2 class="text-xs font-semibold lg:font-black text-gray-400 uppercase tracking-wider lg:tracking-widest mb-1 lg:mb-6">收款設定</h2>
          <p class="text-xs text-gray-300 mb-3 lg:hidden">設定後將顯示於結算明細</p>
          <div id="payment-list" class="space-y-2 lg:space-y-4"></div>
        </div>

      </div>
    </div>

  </div>
</div>

<!-- FAB -->
<button type="button" id="btn-fab"
  class="fixed bottom-6 right-6 bg-blue-600 text-white flex items-center gap-2 px-6 py-4 rounded-full shadow-lg lg:shadow-2xl lg:shadow-blue-300 hover:bg-blue-700 hover:lg:rotate-90 active:scale-95 transition lg:duration-500 z-30">
  <span class="text-2xl font-light leading-none">+</span>
  <span class="font-semibold">新增消費</span>
</button>

<!-- Modal 新增消費 -->
<div id="modal-expense" class="modal-overlay fixed inset-0 bg-black/40 z-50 hidden items-end justify-center">
  <div class="modal-sheet bg-white w-full max-w-md rounded-t-3xl px-6 pt-5 pb-10 max-h-[88vh] overflow-y-auto">
    <div class="flex items-center justify-between mb-5">
      <span id="modal-title" class="text-lg font-bold text-gray-900">新增消費</span>
      <button type="button" id="btn-modal-close" class="w-8 h-8 bg-gray-100 text-gray-500 rounded-full text-sm hover:bg-gray-200 transition flex items-center justify-center">✕</button>
    </div>

    <input type="text" id="input-title" placeholder="消費項目"
      class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-2xl text-sm focus:outline-none focus:border-blue-400 focus:bg-white transition">
    <input type="number" id="input-amount" placeholder="金額" min="0" max="9999999" step="0.01"
      class="w-full mt-2.5 px-4 py-3 bg-gray-50 border border-gray-200 rounded-2xl text-sm focus:outline-none focus:border-blue-400 focus:bg-white transition">
    <input type="date" id="input-date"
      class="w-full mt-2.5 px-4 py-3 bg-gray-50 border border-gray-200 rounded-2xl text-sm focus:outline-none focus:border-blue-400 focus:bg-white transition">

    <div class="mt-4">
      <label class="text-xs font-semibold text-gray-400 uppercase tracking-wider">付款人</label>
      <select id="select-payer"
        class="w-full mt-2 px-4 py-3 bg-gray-50 border border-gray-200 rounded-2xl text-sm focus:outline-none focus:border-blue-400 transition"></select>
    </div>

    <div class="mt-4">
      <label class="text-xs font-semibold text-gray-400 uppercase tracking-wider">參與者</label>
      <div id="participant-checkboxes" class="flex flex-wrap gap-2 mt-2"></div>
    </div>

    <div class="mt-3 flex items-center gap-2">
      <span class="text-xs font-semibold text-gray-400 uppercase tracking-wider">分攤</span>
      <div class="flex rounded-xl overflow-hidden border border-gray-200 text-xs font-semibold">
        <button type="button" id="btn-split-equal" class="px-3 py-1.5 bg-blue-600 text-white transition">均分</button>
        <button type="button" id="btn-split-custom" class="px-3 py-1.5 text-gray-500 hover:bg-gray-50 transition">自訂</button>
      </div>
    </div>
    <div id="custom-split-area" class="hidden mt-3 space-y-2"></div>
    <p id="custom-split-hint" class="hidden text-xs text-right mt-1"></p>

    <button type="button" id="btn-add-expense"
      class="w-full mt-6 py-4 bg-blue-600 text-white font-semibold rounded-2xl hover:bg-blue-700 active:scale-95 transition">
      新增消費
    </button>
  </div>
</div>

<!-- Modal 身份選擇 -->
<div id="modal-identity" class="modal-overlay fixed inset-0 bg-black/40 z-50 hidden items-end justify-center">
  <div class="modal-sheet bg-white w-full max-w-md rounded-t-3xl px-6 pt-5 pb-10">
    <p class="text-base font-bold text-gray-900 text-center">你是哪位？</p>
    <p class="text-xs text-gray-400 text-center mt-1 mb-5">選擇後才能新增消費</p>
    <div id="identity-chips" class="flex flex-wrap gap-3 justify-center"></div>
  </div>
</div>

<script type="module" src="js/group.js"></script>
</body>
</html>
