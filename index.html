<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>分帳 Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="min-h-screen bg-slate-50 font-sans antialiased text-slate-900 flex flex-col items-center justify-center p-6 pb-20 relative overflow-x-hidden">

  <div class="absolute -top-40 -left-40 w-80 h-80 bg-blue-100 rounded-full blur-[100px] opacity-70 pointer-events-none"></div>
  <div class="absolute bottom-0 right-0 w-96 h-96 bg-emerald-100 rounded-full blur-[120px] opacity-60 pointer-events-none"></div>

  <div class="text-center mb-16 relative z-10">
    <div class="inline-flex items-center justify-center w-24 h-24 bg-blue-600 rounded-3xl shadow-xl shadow-blue-200 mb-6 transition-transform hover:rotate-6 cursor-default">
      <svg class="w-12 h-12 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
      </svg>
    </div>
    <h1 class="text-5xl font-black text-slate-950 tracking-tighter mb-3">分帳 <span class="text-blue-600">Pro</span></h1>
    <p class="text-slate-400 font-bold tracking-widest text-sm uppercase">智慧對帳 ‧ 免登入 ‧ 快速結算</p>
  </div>

  <div class="w-full max-w-sm space-y-6 relative z-10">

    <div class="bg-white p-8 rounded-[2.5rem] shadow-2xl shadow-slate-200/70 border border-white transition-shadow hover:shadow-blue-900/5 group">
      <div class="flex items-center gap-3 mb-5">
        <div class="w-10 h-10 bg-blue-50 text-blue-600 rounded-xl flex items-center justify-center font-black shadow-inner">1</div>
        <h2 class="text-xs font-black text-slate-400 uppercase tracking-widest">建立新群組</h2>
      </div>
      <input type="text" id="input-group-name" placeholder="活動名稱，例：墾丁潛水" maxlength="50"
        class="w-full bg-slate-100 border-2 border-slate-100 rounded-2xl p-4 mb-5 focus:bg-white focus:border-blue-500 outline-none transition-all font-bold placeholder:font-medium placeholder:text-slate-300">
      <button type="button" id="btn-create"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-black py-4 rounded-2xl shadow-lg shadow-blue-200 transition-all active:scale-95 flex items-center justify-center gap-2">
        🚀 建立群組
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
        </svg>
      </button>
    </div>

    <div class="flex items-center gap-4 px-10">
      <div class="h-[1px] bg-slate-200 flex-1"></div>
      <span class="text-[10px] font-black text-slate-300 uppercase tracking-[0.2em]">或</span>
      <div class="h-[1px] bg-slate-200 flex-1"></div>
    </div>

    <div class="bg-white p-8 rounded-[2.5rem] shadow-2xl shadow-slate-200/70 border border-white transition-shadow hover:shadow-slate-900/5">
      <div class="flex items-center gap-3 mb-5">
        <div class="w-10 h-10 bg-slate-100 text-slate-500 rounded-xl flex items-center justify-center font-black shadow-inner">2</div>
        <h2 class="text-xs font-black text-slate-400 uppercase tracking-widest">加入現有群組</h2>
      </div>
      <input type="text" id="input-share-code" placeholder="輸入邀請碼" maxlength="20"
        class="w-full bg-slate-100 border-2 border-slate-100 rounded-2xl p-4 mb-5 focus:bg-white focus:border-blue-500 outline-none transition-all font-bold placeholder:font-medium placeholder:text-slate-300">
      <button type="button" id="btn-join"
        class="w-full bg-slate-950 hover:bg-slate-800 text-white font-black py-4 rounded-2xl shadow-xl shadow-slate-200 transition-all active:scale-95 flex items-center justify-center gap-2">
        📥 進入群組
      </button>
    </div>

  </div>

  <footer class="absolute bottom-6 text-center text-[10px] font-medium text-slate-300 tracking-widest z-10">
    © 2026 分帳 Pro
  </footer>

  <script type="module" src="js/home.js"></script>
</body>
</html>
