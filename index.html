<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>分帳 Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="min-h-screen bg-slate-50 flex flex-col items-center justify-center p-6 font-sans antialiased">

  <div class="text-center mb-12">
    <h1 class="text-5xl font-black text-blue-600 tracking-tighter mb-2">分帳 <span class="text-slate-900">Pro</span></h1>
    <p class="text-slate-400 font-bold tracking-widest text-sm uppercase">智慧對帳 ‧ 快速結算</p>
  </div>

  <div class="w-full max-w-sm space-y-6">

    <div class="bg-white p-8 rounded-[2.5rem] shadow-xl shadow-slate-200/60 border border-white">
      <h2 class="text-xs font-black text-slate-400 uppercase tracking-widest mb-4">建立新群組</h2>
      <input type="text" id="input-group-name" placeholder="活動名稱，例：墾丁潛水" maxlength="50"
        class="w-full bg-slate-50 border-2 border-slate-50 rounded-2xl p-4 mb-4 focus:bg-white focus:border-blue-500 outline-none transition-all font-bold">
      <button type="button" id="btn-create"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-black py-4 rounded-2xl shadow-lg shadow-blue-200 transition-all active:scale-95 flex items-center justify-center gap-2">
        <span>🚀</span> 建立並取得連結
      </button>
    </div>

    <div class="flex items-center gap-4 px-8">
      <div class="h-[1px] bg-slate-200 flex-1"></div>
      <span class="text-xs font-bold text-slate-300 uppercase">OR</span>
      <div class="h-[1px] bg-slate-200 flex-1"></div>
    </div>

    <div class="bg-white p-8 rounded-[2.5rem] shadow-xl shadow-slate-200/60 border border-white">
      <h2 class="text-xs font-black text-slate-400 uppercase tracking-widest mb-4">加入現有群組</h2>
      <input type="text" id="input-share-code" placeholder="輸入邀請碼" maxlength="20"
        class="w-full bg-slate-50 border-2 border-slate-50 rounded-2xl p-4 mb-4 focus:bg-white focus:border-blue-500 outline-none transition-all font-bold">
      <button type="button" id="btn-join"
        class="w-full bg-slate-900 hover:bg-slate-800 text-white font-black py-4 rounded-2xl shadow-lg shadow-slate-200 transition-all active:scale-95">
        進入群組
      </button>
    </div>

  </div>

  <script type="module" src="js/home.js"></script>
</body>
</html>
