<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>分帳</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-50 font-sans antialiased min-h-screen">
  <div class="max-w-md mx-auto bg-white min-h-screen shadow-xl">

    <div class="px-8 pt-16 pb-8 text-center">
      <h1 class="text-4xl font-bold text-blue-600 mb-1">分帳</h1>
      <p class="text-sm text-gray-400">簡單記帳，快速結算</p>
    </div>

    <div class="px-5 flex flex-col gap-3 pb-10">

      <div class="bg-white border border-gray-100 rounded-3xl p-6 shadow-sm">
        <h2 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3">建立群組</h2>
        <input type="text" id="input-group-name" placeholder="活動名稱，例：墾丁潛水" maxlength="50"
          class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-2xl text-sm focus:outline-none focus:border-blue-400 focus:bg-white transition">
        <button type="button" id="btn-create"
          class="w-full mt-3 py-3.5 bg-blue-600 text-white font-semibold rounded-2xl hover:bg-blue-700 active:scale-95 transition text-sm">
          建立並取得連結
        </button>
      </div>

      <div class="text-center text-gray-300 text-sm py-1">或</div>

      <div class="bg-white border border-gray-100 rounded-3xl p-6 shadow-sm">
        <h2 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3">加入群組</h2>
        <input type="text" id="input-share-code" placeholder="輸入邀請碼" maxlength="20"
          class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-2xl text-sm focus:outline-none focus:border-blue-400 focus:bg-white transition">
        <button type="button" id="btn-join"
          class="w-full mt-3 py-3.5 bg-gray-900 text-white font-semibold rounded-2xl hover:bg-gray-800 active:scale-95 transition text-sm">
          加入
        </button>
      </div>

    </div>
  </div>
  <script type="module" src="js/home.js"></script>
</body>
</html>
